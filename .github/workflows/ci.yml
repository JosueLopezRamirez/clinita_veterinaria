name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and run tests
        working-directory: clinica_veterinaria
        run: ./mvnw test --batch-mode

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Compute changed Java files
        id: changed
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="origin/${{ github.event.pull_request.base.ref }}"
            git fetch origin "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          else
            BASE="HEAD^"
          fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- 'clinica_veterinaria/**/*.java' | sed -E 's#^clinica_veterinaria/src/(main|test)/java/##' | paste -sd, -)
          echo "includes=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Run linters on changed files
        if: steps.changed.outputs.includes != ''
        working-directory: clinica_veterinaria
        run: ./mvnw checkstyle:check pmd:check --batch-mode -Dcheckstyle.includes="${{ steps.changed.outputs.includes }}" -Dpmd.includes="${{ steps.changed.outputs.includes }}"