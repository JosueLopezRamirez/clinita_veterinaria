apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinica-vet-app
  namespace: clinica-vet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clinica-vet-app
  template:
    metadata:
      labels:
        app: clinica-vet-app
    spec:
      containers:
        - name: app
          image: localhost/clinica-vet-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_URL
            - name: DB_USER_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_USER_NAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password
          readinessProbe:
            httpGet:
              path: /mascotas/traer
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /duenio/traer
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20